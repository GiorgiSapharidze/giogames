```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GioGames</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #111111;
    --surface: #191919;
    --surface-hover: #202020;
    --border: #2b2b2b;

    --text: #f2f0eb;
    --muted: #858585;
    --faint: #555555;

    --green: #b7d66b;
    --red: #e47d67;
    --blue: #8da9e8;

    --display: "Space Grotesk", sans-serif;
    --mono: "DM Mono", monospace;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--display);
    min-height: 100vh;
  }

  ::selection {
    background: var(--text);
    color: var(--bg);
  }

  /* ---------------- HEADER ---------------- */

  header {
    max-width: 1080px;
    margin: 0 auto;
    padding: 72px 28px 56px;
  }

  .topline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 42px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text);
    letter-spacing: -0.04em;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;

    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
  }

  h1 {
    font-size: clamp(48px, 8vw, 88px);
    line-height: 0.9;
    letter-spacing: -0.065em;
    font-weight: 700;
    max-width: 800px;
  }

  .intro {
    margin-top: 28px;
    max-width: 470px;

    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
  }

  .intro strong {
    color: var(--text);
    font-weight: 500;
  }

  /* ---------------- MAIN ---------------- */

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 28px 100px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);

    margin-bottom: 8px;
  }

  .section-title {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .game-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
  }

  /* ---------------- GAME LIST ---------------- */

  .game-list {
    display: flex;
    flex-direction: column;
  }

  .game {
    position: relative;

    display: grid;
    grid-template-columns: 72px 1fr auto;
    align-items: center;
    gap: 24px;

    min-height: 150px;
    padding: 24px 18px;

    border-bottom: 1px solid var(--border);

    color: var(--text);
    text-decoration: none;

    transition:
      background 0.2s ease,
      padding 0.2s ease;
  }

  .game:hover {
    background: var(--surface);
    padding-left: 28px;
    padding-right: 28px;
  }

  /* number */

  .game-number {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--faint);
    align-self: flex-start;
    padding-top: 4px;
  }

  /* icon */

  .game-icon {
    position: absolute;
    left: 18px;
    bottom: 22px;

    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: var(--green);

    opacity: 0.9;

    transition:
      transform 0.2s ease,
      color 0.2s ease;
  }

  .game:hover .game-icon {
    transform: translateY(-3px);
  }

  .game:nth-child(2) .game-icon {
    color: var(--red);
  }

  /* text */

  .game-info {
    min-width: 0;
  }

  .game-tag {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;

    color: var(--muted);

    margin-bottom: 8px;
  }

  .game-title {
    font-size: clamp(25px, 4vw, 38px);
    line-height: 1;
    letter-spacing: -0.045em;
    font-weight: 600;

    margin-bottom: 9px;
  }

  .game-description {
    color: var(--muted);
    font-size: 14px;
  }

  /* arrow */

  .game-arrow {
    font-size: 24px;
    color: var(--faint);

    transition:
      transform 0.2s ease,
      color 0.2s ease;
  }

  .game:hover .game-arrow {
    transform: translateX(5px);
    color: var(--text);
  }

  /* ---------------- EMPTY ---------------- */

  .empty {
    display: grid;
    grid-template-columns: 72px 1fr;

    align-items: center;

    min-height: 110px;
    padding: 24px 18px;

    border-bottom: 1px solid var(--border);

    color: var(--faint);
  }

  .empty-number {
    font-family: var(--mono);
    font-size: 12px;
  }

  .empty-text {
    font-family: var(--mono);
    font-size: 12px;
  }

  .empty-text span {
    color: var(--muted);
  }

  /* ---------------- FOOTER ---------------- */

  footer {
    max-width: 1080px;
    margin: 0 auto;

    padding: 28px;

    display: flex;
    justify-content: space-between;
    gap: 20px;

    border-top: 1px solid var(--border);

    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
  }

  footer b {
    color: var(--muted);
    font-weight: 400;
  }

  /* ---------------- MOBILE ---------------- */

  @media (max-width: 650px) {

    header {
      padding: 42px 20px 48px;
    }

    .topline {
      margin-bottom: 55px;
    }

    h1 {
      font-size: clamp(52px, 16vw, 76px);
      max-width: 500px;
    }

    .intro {
      font-size: 15px;
      margin-top: 24px;
    }

    main {
      padding: 0 20px 70px;
    }

    .game {
      grid-template-columns: 42px 1fr auto;
      gap: 14px;

      min-height: 145px;
      padding: 22px 8px;
    }

    .game:hover {
      padding-left: 12px;
      padding-right: 12px;
    }

    .game-number {
      font-size: 10px;
    }

    .game-icon {
      left: 8px;
      bottom: 18px;

      width: 34px;
      height: 34px;
    }

    .game-icon svg {
      width: 34px;
      height: 34px;
    }

    .game-title {
      font-size: 27px;
    }

    .game-description {
      font-size: 13px;
    }

    .game-arrow {
      font-size: 20px;
    }

    .empty {
      grid-template-columns: 42px 1fr;
      padding: 22px 8px;
    }

    footer {
      padding: 24px 20px;
      flex-direction: column;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      transition: none !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>

<body>

<header>

  <div class="topline">
    <div class="logo">gio.games</div>

    <div class="status">
      <span class="status-dot"></span>
      currently making stuff
    </div>
  </div>

  <h1>games<br>i made.</h1>

  <p class="intro">
    <strong>Small games, experiments and stupid ideas.</strong>
    Mostly made because I wanted to see if I could.
  </p>

</header>


<main>

  <div class="section-header">
    <div class="section-title">games</div>
    <div class="game-count" id="gameCount"></div>
  </div>

  <div class="game-list" id="gameList"></div>

</main>


<footer>
  <div>gio games</div>
  <div>made by <b>giorgi</b></div>
</footer>


<script>

const games = [

  {
    title: "Orbit Snake",
    tag: "arcade",
    desc: "snake but on an orbit.",
    href: "orbit-snake",
    color: "green",

    icon: `
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="4"/>
        <ellipse cx="12" cy="12" rx="10" ry="4"/>
      </svg>
    `
  },

  {
    title: "Typer",
    tag: "speed",
    desc: "collect the most words.",
    href: "typer",
    color: "red",

    icon: `
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
        <path d="m15 5 4 4"/>
      </svg>
    `
  }

];


const list = document.getElementById("gameList");
const count = document.getElementById("gameCount");

count.textContent =
  `${String(games.length).padStart(2, "0")} available`;


games.forEach((game, index) => {

  const item = document.createElement("a");

  item.className = "game";
  item.href = game.href;

  item.innerHTML = `

    <div class="game-number">
      ${String(index + 1).padStart(2, "0")}
    </div>

    <div class="game-info">

      <div class="game-tag">
        ${game.tag}
      </div>

      <div class="game-title">
        ${game.title}
      </div>

      <div class="game-description">
        ${game.desc}
      </div>

    </div>

    <div class="game-arrow">
      ↗
    </div>

    <div class="game-icon">
      ${game.icon}
    </div>

  `;

  list.appendChild(item);

});


/* fake empty slots */

for (let i = games.length; i < games.length + 3; i++) {

  const empty = document.createElement("div");

  empty.className = "empty";

  empty.innerHTML = `

    <div class="empty-number">
      ${String(i + 1).padStart(2, "0")}
    </div>

    <div class="empty-text">
      <span>something</span> coming eventually
    </div>

  `;

  list.appendChild(empty);
}

</script>

</body>
</html>
